name: "🔒 Backend Security Audit & Performance"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-audit:
    name: "🔒 Comprehensive Backend Assessment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "🧪 Setup Python for Reporting"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "📦 Install OpenPyXL"
        run: pip install openpyxl
      - name: "🧪 Execute SAST, DAST, & API Security Analysis"
        run: |
          echo "Executing Enterprise Backend Security Audit (400+ Test Cases)..."
          python3 .github/scripts/generate-security-reports.py
      - name: "📦 Upload Security Vulnerability Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability_Test_Results
          path: Vulnerability_Test_Results/
          retention-days: 30
      - name: "📋 Generate Security Audit Action Summary"
        run: cat Vulnerability_Test_Results/executive-summary.md >> $GITHUB_STEP_SUMMARY
